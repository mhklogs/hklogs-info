name: Deploy to Vercel

# Push-to-deploy. The Vercel GitHub App is not installed on this account, so
# Vercel cannot see the repo natively and the deploy runs from Actions instead.
#
# The job is gated on vars.VERCEL_DEPLOY_ENABLED (a repo variable) rather than on
# the token: `secrets` is not in the allowed context list for a job-level `if`,
# and referencing it there makes the whole workflow invalid.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Step-level `if` does allow secrets, so the token gate lives here.
      - name: Deploy
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Explain skipped deploy
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "::warning title=Deploy skipped::No VERCEL_TOKEN secret on this repo."
          echo "Create one at https://vercel.com/account/tokens and add it with:"
          echo "  gh secret set VERCEL_TOKEN --repo ${{ github.repository }} --body '<token>'"
          echo "Until then, deploy manually with: vercel --prod"