name: Deploy to Vercel

# Push-to-deploy. The Vercel GitHub App is not installed on this account, so
# Vercel cannot see the repo natively and the deploy runs from Actions instead.
#
# Note: `secrets` cannot appear inside any `if` expression here. On this account
# doing so makes GitHub reject the whole file — the run fails with zero jobs.
# So the token is read into env, tested in a shell step, and the deploy is gated
# on that step's output instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy token
        id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to production
        if: steps.check.outputs.available == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Explain skipped deploy
        if: steps.check.outputs.available != 'true'
        run: |
          echo "::warning title=Deploy skipped::No VERCEL_TOKEN secret on this repo."
          echo "Create a token at https://vercel.com/account/tokens then add it with:"
          echo "  gh secret set VERCEL_TOKEN --repo ${{ github.repository }} --body '<token>'"
          echo "Until then, deploy manually from a clone with the project linked: vercel --prod"